<div class="form-dialog">
  <header class="form-dialog-header">
    <span class="form-dialog-icon mint-icon" aria-hidden="true">＋</span>
    <div>
      <p class="form-dialog-eyebrow">TOKEN FACTORY</p>
      <h1 mat-dialog-title class="dialog-title">Mint tokens</h1>
      <p class="form-dialog-subtitle">Issue tokens to the connected wallet.</p>
    </div>
  </header>
  <div mat-dialog-content class="form-dialog-content">
    <label class="field-caption" for="mint-amount">Amount</label>
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="compact-field">
      <input id="mint-amount" matInput [(ngModel)]="data.amount" placeholder="Enter whole token amount" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
    </mat-form-field>
    <section class="asset-summary" aria-label="Token details">
      <div class="asset-heading"><span class="asset-symbol">{{ data.symbol }}</span><strong>{{ data.name }}</strong></div>
      <div class="asset-address"><span>CONTRACT</span><code>{{ data.address }}</code></div>
    </section>
  </div>
  <div mat-dialog-actions class="form-dialog-actions">
    <button mat-button class="secondary-action" type="button" (click)="onCancel()">Cancel</button>
    <button mat-flat-button class="primary-action" type="button" [disabled]="!canSubmit" (click)="onMint()">Mint tokens</button>
  </div>
</div>
