{% for sym, info in tickers.items() %}
  {% if not q or q in sym %}
  <tr
    data-symbol="{{ sym }}"
    class="ticker-row cursor-pointer hover:bg-slate-800/50 transition-colors {% if sym == symbol %}bg-blue-600/30 border-l-2 border-blue-500 font-semibold{% endif %}"
    
    {# 🌟 HTMX MAGIC: Click triggers a smooth navigation swipe of the core layout #}
    hx-get="/?symbol={{ sym }}"
    hx-target="#ticker-rows"
    hx-push-url="true"
    hx-select="#ticker-rows"
  >
    <td class="p-3">
      <div class="flex items-center gap-2">
        {% if sym == symbol %}
          <span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse"></span>
        {% endif %}
        <span>{{ sym }}</span>
      </div>
    </td>
    <td class="p-3 text-right font-mono">${{ "%.2f"|format(info.price) }}</td>
  </tr>
  {% endif %}
{% else %}
  <tr><td colspan="2" class="p-4 text-slate-500 text-center">No tickers available</td></tr>
{% endfor %}
